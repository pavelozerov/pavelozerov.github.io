<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pavel Ozerov</title>
        <meta name="description" content="Pavel Ozerov's website">

        <link rel="icon" href="data:,">

        <link rel="preload" href="fonts/literata-latin.woff2" as="font" type="font/woff2" crossorigin>

        <style>
            @font-face {
                font-family: "Literata";
                font-style: normal;
                font-weight: 200 900;
                font-display: swap;
                src: url("fonts/literata-latin.woff2") format("woff2");
                unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
            }
            @font-face {
                font-family: "Literata";
                font-style: normal;
                font-weight: 200 900;
                font-display: swap;
                src: url("fonts/literata-latin-ext.woff2") format("woff2");
                unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
            }

            :root {
                --bg: #ffffff;
                --text: #1f1f1f;
                --muted: #707070;
                --link: #0b3d91;
                --visited: #5a2d82;
                color-scheme: light dark;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #181818;
                    --text: #e4e2dd;
                    --muted: #999690;
                    --link: #93b4ff;
                    --visited: #c9a8f2;
                }
            }

            body {
                margin: 0;
                background: var(--bg);
                color: var(--text);
                font-family: "Literata", Georgia, "Times New Roman", serif;
                font-size: 18px;
                line-height: 1.65;
                -webkit-font-smoothing: antialiased;
            }

            main {
                max-width: 38rem;
                margin: 0 auto;
                padding: 5rem 1.25rem 4rem;
            }

            a { color: var(--link); text-underline-offset: 0.18em; text-decoration-thickness: 1px; }
            a:visited { color: var(--visited); }
            a:hover { text-decoration-thickness: 2px; }
            a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; border-radius: 2px; }

            h1 {
                font-size: 2rem;
                font-weight: 600;
                line-height: 1.2;
                letter-spacing: -0.01em;
                margin: 0;
            }

            hr {
                width: 2.5rem;
                height: 1px;
                margin: 1.75rem 0;
                border: none;
                background: var(--text);
            }

            address {
                font-style: normal;
            }
            address .city { color: var(--muted); }

            .articles { list-style: none; margin: 0; padding: 0; }
            .articles li {
                display: grid;
                grid-template-columns: 5.5rem 1fr;
                gap: 1rem;
                padding: 0.3rem 0;
            }
            .articles time {
                color: var(--muted);
                font-size: 0.9em;
                font-variant-numeric: tabular-nums;
                padding-top: 0.08em;
            }

            @media (max-width: 30rem) {
                body { font-size: 17px; }
                main { padding-top: 3rem; }
                h1 { font-size: 1.75rem; }
                .articles li { grid-template-columns: 1fr; gap: 0; padding: 0.45rem 0; }
            }
        </style>
    </head>

    <body>
        <main>

            <h1>Pavel Ozerov’s website</h1>

            <hr>

            <address>
                Pavel Ozerov<br>
                <span class="city">Tallinn, Estonia</span><br>
                <a href="mailto:pavel.ozerov@gmail.com">pavel.ozerov@gmail.com</a>
            </address>

            <hr>

            <ul class="articles">
                <li>
                    <time datetime="2020-02">Feb 2020</time>
                    <a href="https://github.com/pavelozerov/articles/blob/master/semantics-of-ubiquitous-language.md">Semantics of Ubiquitous Language (SOUL)</a>
                </li>
                <li>
                    <time datetime="2024-02">Feb 2024</time>
                    <a href="https://github.com/pavelozerov/articles/blob/master/thoughts-on-testing.md">My thoughts on software testing</a>
                </li>
            </ul>

        </main>
    </body>

</html>
